version: 1
packet_id: example-review-packet
repository_root: /absolute/path/to/repository
source_root: /absolute/path/to/repository
files:
  - README.md
project:
  project_id: example-review
  sensitivity: private
  max_runtime_seconds: 300
  # False is the safe default. Set true only for a non-sensitive packet that may
  # use the exact-manifest, explicit-user-approval and single-use-grant workflow.
  # Eligibility is not approval and does not enable unattended access by itself.
  allow_unattended_approval: false
  allowed_models:
    - gemini-3.8-flash-high
    - gemini-3.1-pro-high
